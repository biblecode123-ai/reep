name: PHP syntax checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint PHP application, scripts, and tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find app scripts tests -type f -name '*.php' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done
